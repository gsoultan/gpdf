name: Go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install poppler (interoperability checks)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core fonts-liberation fonts-urw-base35
      - name: Install optional fonts (OpenType CFF and CJK tests skip without them)
        run: sudo apt-get install -y fonts-inter fonts-noto-cjk || true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
